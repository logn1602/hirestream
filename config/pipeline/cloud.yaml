# Pipeline settings for HIRESTREAM_ENV=cloud (SPEC §5.2). Nothing account-specific is committed:
# the lake bucket (s3a://hirestream-lake-<account>-<region>) comes from HIRESTREAM_LAKE_ROOT, set
# from the CDK outputs, and the EMR application, release and role arrive with T4.3.
lake_root: null
reprocess_days: 7
dq_checks: config/dq/checks.yaml
spark:
  shuffle_partitions: 64 # four waves on the 16-vCPU default quota (ADR-0003 G9); revisit in T4.3
  conf: {}
