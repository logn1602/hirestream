name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped moving its major tag after v7, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Java 17 matches local and EMR (ADR-0002); PySpark tests need it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Boots the local stack (docker/docker-compose.yml) and requires every healthcheck to pass.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: make up
      - name: Verify every service is healthy
        run: |
          docker compose -f docker/docker-compose.yml --env-file .env ps --format '{{.Service}} {{.Health}}' | tee health.txt
          test "$(grep -c ' healthy$' health.txt)" -eq 3
      - name: Show status and logs on failure
        if: failure()
        run: |
          make ps
          docker compose -f docker/docker-compose.yml --env-file .env logs --no-color --tail 200
      - run: make down
        if: always()

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the action scans the PR / pushed commit range, which needs history
      # No GITLEAKS_LICENSE: not required for repos under a personal account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.0" # keep in step with .pre-commit-config.yaml
