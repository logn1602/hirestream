[project]
name = "hirestream"
version = "0.0.0"
description = "Recruiting and internal-mobility data platform for a simulated 25,000-person company."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubh Dave" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43.109",
    "faker>=40.39.0",
    "numpy>=2.4.6,<2.5", # numpy 2.5 requires Python 3.12; we are on 3.11 (ADR-0002)
    "orjson>=3.13.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
hirestream = "hirestream.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[kinesis]>=1.43.108",
    "jsonschema>=4.26.0",
    "moto[kinesis]>=5.2.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
# Exact pin to the Spark version of EMR_RELEASE_LABEL (ADR-0002). EMR provides its own pyspark,
# so this group is never shipped to the cluster; tests/unit/test_versions.py guards drift.
spark = [
    "pyspark==4.1.1",
]

[tool.uv]
default-groups = ["dev", "spark"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "slow: long-running tests, excluded from the default run",
    "integration: needs a Postgres at HIRESTREAM_TEST_ATS_DSN; skipped when it is unset",
    "full: reads a full-preset lake at HIRESTREAM_FULL_LAKE; skipped when it is unset",
]

[tool.coverage.run]
source = ["hirestream"]
branch = true

[tool.coverage.report]
# Report only for now; the 85% gate (fail_under) is enforced from T2.15.
show_missing = true
skip_empty = true
