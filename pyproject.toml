[project]
name = "hirestream"
version = "0.0.0"
description = "Recruiting and internal-mobility data platform for a simulated 25,000-person company."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubh Dave" }]
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
# Exact pin to the Spark version of EMR_RELEASE_LABEL (ADR-0002). EMR provides its own pyspark,
# so this group is never shipped to the cluster; tests/unit/test_versions.py guards drift.
spark = [
    "pyspark==4.1.1",
]

[tool.uv]
default-groups = ["dev", "spark"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["slow: long-running tests, excluded from the default run"]

[tool.coverage.run]
source = ["hirestream"]
branch = true

[tool.coverage.report]
# Report only for now; the 85% gate (fail_under) is enforced from T2.15.
show_missing = true
skip_empty = true
